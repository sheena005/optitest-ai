name: OptiTest AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Compile C++ Physics Engine & Run Native C++ Tests
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Install pybind11 Native Extension
        run: |
          pip install --no-build-isolation -e .

      - name: Execute Full Python Test Suite with Coverage
        run: |
          pytest tests/ --cov=optitest --cov-report=term-missing --cov-fail-under=60
